<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TeamBoard · 团队看板</title>
<style>
/* TeamBoard · signal · dark studio · 2026-10-28
   dark-first, acid-lime accent, editorial type scale, low-noise surfaces */
:root{
  color-scheme:dark;
  --bg:#08090b; --bg-2:#0b0d10;
  --surface:rgba(255,255,255,.034); --surface-2:rgba(255,255,255,.058); --surface-3:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.165);
  --ink-1:#f4f7f5; --ink-2:#b3bfbb; --ink-3:#7b8885; --ink-4:#5c6866;
  --lime:#ccf556; --lime-deep:#a8d92f; --on-lime:#0d1104;
  --mint:#4fe3a3; --violet:#b6a3ff; --coral:#ff7d6c; --sky:#6ec8ff; --amber:#f5c04a;
  --done:var(--mint); --doing:var(--lime); --review:var(--violet); --blocked:var(--coral); --backlog:#8b9694;
  --accent:var(--lime); --glow:rgba(204,245,86,.22);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -32px rgba(0,0,0,.9);
  --shadow-lg:0 1px 0 rgba(255,255,255,.07) inset, 0 40px 80px -40px rgba(0,0,0,.95);
  --r:18px; --r-sm:11px; --r-lg:26px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink-2);
  font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;
  font-feature-settings:"tnum" 0;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 460px at 6% -12%, rgba(204,245,86,.14), transparent 62%),
    radial-gradient(720px 400px at 98% -14%, rgba(182,163,255,.13), transparent 64%),
    radial-gradient(760px 380px at 50% 118%, rgba(79,227,163,.055), transparent 62%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(700px 420px at 50% 0%, #000 0%, transparent 75%);
}
::selection{background:rgba(204,245,86,.28);color:var(--ink-1)}
h1,h2,h3,h4{margin:0;color:var(--ink-1);font-weight:650;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(204,245,86,.55)}

/* ---------- type ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:650;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--line-2)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.045em}
code{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px;color:#dbe6c8}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  font:inherit;font-weight:600;font-size:12.5px;line-height:1;
  padding:10px 14px;border-radius:11px;cursor:pointer;color:var(--ink-1);
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform .14s cubic-bezier(.2,.7,.3,1),background .16s,border-color .16s,box-shadow .2s,color .16s;
}
.btn:hover{transform:translateY(-1px);background:var(--surface-3);border-color:var(--line-2)}
.btn:active{transform:none}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.btn.primary:hover{background:var(--lime-deep);border-color:var(--lime-deep);box-shadow:0 14px 30px -14px var(--glow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface);color:var(--ink-1);border-color:var(--line)}
.btn.danger{color:var(--coral);border-color:transparent;background:transparent}
.btn.danger:hover{background:rgba(255,125,108,.1);border-color:rgba(255,125,108,.3)}
.btn.icon{padding:9px 10px;border-radius:10px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label,.lbl{font-size:10px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input,select,textarea{
  font:inherit;font-size:13.5px;color:var(--ink-1);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input::placeholder,textarea::placeholder{color:var(--ink-4)}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(204,245,86,.65);
  background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(204,245,86,.12)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
select{appearance:none;padding-right:34px;background-image:
  linear-gradient(45deg,transparent 49%,var(--ink-3) 50%),linear-gradient(-45deg,transparent 49%,var(--ink-3) 50%);
  background-size:5px 5px,5px 5px;background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);
  background-repeat:no-repeat}
select:disabled{opacity:.5;cursor:not-allowed}
optgroup{background:#121518;color:var(--ink-2)}
option{background:#121518;color:var(--ink-1)}

/* ---------- chips / badges ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;line-height:1;
  padding:7px 11px;border-radius:999px;color:var(--ink-3);background:var(--surface);
  border:1px solid var(--line);white-space:nowrap;
}
.chip b{color:var(--ink-1);font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.chip.done{color:var(--mint);border-color:rgba(79,227,163,.24);background:rgba(79,227,163,.09)}
.chip.doing{color:var(--lime);border-color:rgba(204,245,86,.24);background:rgba(204,245,86,.08)}
.chip.review{color:var(--violet);border-color:rgba(182,163,255,.26);background:rgba(182,163,255,.1)}
.chip.blocked{color:var(--coral);border-color:rgba(255,125,108,.28);background:rgba(255,125,108,.1)}
.chip.backlog{color:var(--ink-2)}
.chip.done b{color:var(--mint)} .chip.doing b{color:var(--lime)} .chip.review b{color:var(--violet)} .chip.blocked b{color:var(--coral)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;letter-spacing:.02em;
  padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);border:1px solid transparent}
.badge.working{background:rgba(204,245,86,.12);color:var(--lime);border-color:rgba(204,245,86,.22)}
.badge.blocked{background:rgba(255,125,108,.12);color:var(--coral);border-color:rgba(255,125,108,.26)}
.badge.idle{background:var(--surface-2);color:var(--ink-3)}
.badge.offline{background:transparent;color:var(--ink-4);border:1px dashed var(--line-2)}
.badge.stale{background:rgba(255,183,77,.12);color:#ffb74d;border-color:rgba(255,183,77,.3)}

/* ---------- surfaces ---------- */
.surface{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.022));
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:46px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-1);font-size:14.5px;margin-bottom:6px;font-weight:650;letter-spacing:-.01em}

.track{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.track>i{display:block;height:100%;border-radius:999px;background:var(--lime);transition:width .6s cubic-bezier(.2,.7,.3,1)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:90;padding:20px;
  background:rgba(4,6,6,.66);backdrop-filter:blur(10px) saturate(120%)}
.modal.on{display:grid}
.modal.on .sheet{animation:sheetIn .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#0e1114;
  border:1px solid var(--line-2);border-radius:var(--r-lg);padding:26px;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 60px 120px -50px rgba(0,0,0,.95)}
.sheet h4{font-size:18px;letter-spacing:-.03em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sheet h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lime);box-shadow:0 0 12px var(--glow)}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.sheet .foot .btn{padding:11px 16px}
.foot{display:flex;gap:10px}
.row2{display:flex;gap:14px}.row2>*{flex:1;min-width:0}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:7px;display:block}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}


  /* 全员停摆 / 没有自驱：项目「会不会自己往前走」的全部答案，常驻不可折叠 */
  .idlewrap:empty{display:none}
  .idlewrap{padding:0 24px 10px}
  .idleb{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
         font-size:12.5px;line-height:1.5;border:1px solid transparent}
  .idleb+.idleb{margin-top:6px}
  .idleb.bad{border-color:rgba(255,92,92,.42);background:rgba(255,92,92,.09);color:#ffb3ad}
  .idleb.warn{border-color:rgba(255,196,84,.38);background:rgba(255,196,84,.08);color:#ffd79a}
  .idleb b{color:#fff}
  .idleb .more{margin-left:auto;color:var(--ink-3);font-size:11.5px;cursor:pointer;
               text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
  .idleb .who{color:var(--ink-4);font-size:11.5px}
</style>
<style>
  /* ---------- shell ---------- */
  .topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);
    background:rgba(9,11,13,.72);backdrop-filter:blur(20px) saturate(150%)}
  .row1{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:16px;
    padding:14px 24px 10px}
  /* 全部项目（home）：返回键落到这里，一屏看完所有项目 */
  /* 会话内审批卡：只渲染这一块，不铺整个看板（否则内嵌进去又长又黑） */
  #apcard{padding:14px 14px 16px;background:transparent}
  .apc{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.012));
    padding:16px 18px 14px;display:grid;gap:12px}
  .apc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .apc-tag{font:700 9.5px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;
    color:var(--on-lime);background:var(--lime);border-radius:5px;padding:4px 7px}
  .apc-h b{font-size:14.5px;letter-spacing:-.015em;color:var(--ink-1)}
  .apc .sub{font-size:11.5px;color:var(--ink-3);line-height:1.6}
  .apc-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
  .apc-box .lab{font:600 9.5px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
  .apc-box p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-1)}
  .apc-chips{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
  .apc-chips span{border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .apc-chips span.warn{border-color:rgba(255,183,77,.5);color:#ffb74d}
  .apc-list{display:grid;gap:6px;font-size:11.5px;color:var(--ink-2)}
  .apc-list i{color:var(--ink-4);font-style:normal;font-variant-numeric:tabular-nums;margin-right:6px}
  .apc-note input{width:100%;box-sizing:border-box;background:rgba(0,0,0,.28);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;color:var(--ink-1);font:inherit;font-size:12px;outline:none}
  .apc-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .apc-act button{font:inherit;font-size:12px;font-weight:650;padding:9px 16px;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
  .apc-act button:hover{border-color:var(--ink-3);color:var(--ink-1)}
  .apc-act button.pri{background:var(--lime);border-color:transparent;color:var(--on-lime)}
  .apc-act button.dan:hover{border-color:var(--coral);color:var(--coral)}
  .apc-act .done{margin-left:auto;font-size:11.5px;color:var(--mint)}
  .tbtoast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);
    max-width:78%;padding:10px 16px;border-radius:11px;background:#1b201e;border:1px solid var(--line);
    color:var(--ink-1);font-size:12px;line-height:1.5;opacity:0;pointer-events:none;
    transition:.18s ease;z-index:9999;white-space:pre-wrap}
  .tbtoast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .home{max-width:1220px;margin:0 auto;padding:24px 24px 64px}
  .home-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  .home-h h2{margin:0;font-size:21px;letter-spacing:-.022em;color:var(--ink-1)}
  .home-h p{margin:5px 0 0;font-size:12px;color:var(--ink-3)}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .pcard{border:1px solid var(--line);border-radius:16px;background:var(--card);
    padding:16px 17px 14px;cursor:pointer;display:grid;gap:11px;transition:.16s ease;position:relative;overflow:hidden}
  .pcard:hover{border-color:rgba(212,255,58,.5);transform:translateY(-1px)}
  .pcard .ph{display:flex;align-items:flex-start;gap:10px}
  .pcard .pn{font-size:14.5px;font-weight:680;letter-spacing:-.015em;color:var(--ink-1);line-height:1.35}
  .pcard .pp{margin-left:auto;font:700 22px/1 var(--font-num,ui-monospace,monospace);
    color:var(--lime);font-variant-numeric:tabular-nums;flex:none}
  .pcard .pg{font-size:11.5px;line-height:1.6;color:var(--ink-3);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .pbar{height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
  .pcard .pbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#8ff37a,var(--lime))}
  .pcard .pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;color:var(--ink-3)}
  .pcard .pill{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
  .pcard .pill.warn{border-color:rgba(255,183,77,.45);color:#ffb74d}
  .pcard .pill.bad{border-color:rgba(255,107,94,.5);color:var(--coral)}
  .pcard .pill.ok{border-color:rgba(79,227,163,.4);color:var(--mint)}
  .pcard .pfoot{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--ink-4)}
  .pcard .avatars{display:flex}
  .pcard .avatars i{width:17px;height:17px;border-radius:50%;margin-left:-5px;
    border:1.5px solid var(--card);display:grid;place-items:center;font:600 8px/1 system-ui;color:#0b0d0c}
  .pcard .avatars i:first-child{margin-left:0}
  .home .empty-h{padding:56px 0;text-align:center;color:var(--ink-3);font-size:13px}

  .back{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex:0 0 34px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:15px;
    transition:.15s}
  .back:hover{color:var(--lime);border-color:rgba(204,245,86,.4);transform:translateX(-2px);background:rgba(204,245,86,.07)}
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .mark{width:24px;height:24px;border-radius:7px;position:relative;
    background:linear-gradient(150deg,var(--lime) 8%,#84b51c 52%,#3f6f18);
    box-shadow:0 2px 12px -3px var(--glow)}
  .mark::after{content:"";position:absolute;inset:7px 7px 7px 7px;border-radius:2px;background:#0b0e08}
  .bt b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--ink-1);line-height:1.2}
  .bt i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-4)}
  .proj{min-width:0;padding-left:18px;border-left:1px solid var(--line)}
  .proj h1{font-size:17px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  .proj span{display:block;margin-top:2px;color:var(--ink-3);font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
  .hactions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .hactions .btn{padding:9px 13px}
  .row2{display:flex;align-items:center;gap:18px;padding:0 24px 13px}
  .prog{display:flex;align-items:center;gap:12px;flex:0 0 300px;min-width:0}
  .prog .pct{font-size:22px;font-weight:800;color:var(--ink-1);letter-spacing:-.05em;line-height:1;
    font-variant-numeric:tabular-nums;min-width:56px}
  .pct small{font-size:11px;font-weight:650;color:var(--ink-3);letter-spacing:0;margin-left:1px}
  .rails{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .rail{display:flex;gap:2px;height:7px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07)}
  .rail i{display:block;height:100%;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .rail .s-done{background:var(--mint)} .rail .s-doing{background:var(--lime)}
  .rail .s-review{background:var(--violet)} .rail .s-blocked{background:var(--coral)}
  .rail .s-backlog{background:rgba(255,255,255,.16)}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

  main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;
    min-height:calc(100vh - 104px)}
  .left{display:flex;flex-direction:column;min-width:0}
  .viewbar{display:flex;align-items:center;gap:12px;padding:14px 24px 0;flex-wrap:wrap}
  .tabs{display:inline-flex;gap:3px;padding:3px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
  .tabs button{border:0;background:transparent;color:var(--ink-3);font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:10px;cursor:pointer;transition:.15s;letter-spacing:.01em}
  .tabs button:hover{color:var(--ink-1);background:rgba(255,255,255,.05)}
  .tabs button.on{background:var(--lime);color:var(--on-lime);box-shadow:0 6px 18px -10px var(--glow)}
  .viewbar .tools{display:flex;align-items:center;gap:6px;margin-left:auto}
  .tool{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;color:var(--ink-3);
    background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 9px;cursor:pointer;transition:.15s}
  .tool:hover{color:var(--ink-1);background:var(--surface);border-color:var(--line)}
  .view{flex:1;overflow:auto;padding:16px 24px 44px;min-width:0}

  /* ---------- board ---------- */
  .board{display:flex;gap:12px;align-items:flex-start;min-height:100%}
  .col{flex:1 1 0;min-width:0;max-width:360px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid var(--line);border-radius:18px;max-height:calc(100vh - 190px);
    transition:border-color .18s,box-shadow .2s,background .18s}
  .col.hi{border-color:rgba(204,245,86,.55);background:rgba(204,245,86,.05);
    box-shadow:0 0 0 3px rgba(204,245,86,.1),0 30px 60px -40px #000}
  .colhead{display:flex;align-items:center;gap:9px;width:100%;padding:12px 13px;
    background:transparent;border:0;border-bottom:1px solid transparent;cursor:pointer;
    text-align:left;border-radius:18px 18px 0 0;transition:background .15s;color:var(--ink-1)}
  .colhead:hover{background:rgba(255,255,255,.04)}
  .colhead .chev{width:13px;height:13px;flex:0 0 13px;color:var(--ink-4);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
  .col:not(.collapsed) .colhead .chev{transform:rotate(90deg)}
  .colhead .cd{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--backlog)}
  .col[data-c=doing] .cd{background:var(--lime);box-shadow:0 0 10px rgba(204,245,86,.7)}
  .col[data-c=review] .cd{background:var(--violet);box-shadow:0 0 10px rgba(182,163,255,.55)}
  .col[data-c=done] .cd{background:var(--mint)}
  .col[data-c=blocked] .cd{background:var(--coral);box-shadow:0 0 10px rgba(255,125,108,.6)}
  .colhead .cname{font-size:12px;font-weight:700;letter-spacing:.01em}
  .colhead .ccount{margin-left:auto;font-size:10.5px;font-weight:650;color:var(--ink-3);
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 8px;
    font-variant-numeric:tabular-nums}
  .col.collapsed .cards{display:none}
  .col.collapsed{max-height:none}
  .cardswrap{display:flex;flex-direction:column;min-height:0}
  .cards{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:56px}
  .more{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 18px);margin:0 9px 9px;
    padding:8px;border-radius:10px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-3);
    font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s}
  .more:hover{color:var(--lime);border-color:rgba(204,245,86,.4);background:rgba(204,245,86,.05)}

  .card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .card:hover{transform:translateY(-2px);border-color:rgba(204,245,86,.3);
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 20px 40px -26px #000}
  .card .top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .tag{font-size:9.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;
    background:rgba(255,255,255,.06);color:var(--ink-3);white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
  /* 优先级直接写字，别让人猜红点含义 */
  .pchip{font:700 9px/1 system-ui;letter-spacing:.04em;padding:3px 6px;border-radius:5px;flex:0 0 auto;
    border:1px solid transparent}
  .pchip.p1{color:#ff8f80;background:rgba(255,125,108,.12);border-color:rgba(255,125,108,.35)}
  .pchip.p2{color:#e3b25a;background:rgba(227,178,90,.1);border-color:rgba(227,178,90,.28)}
  .pchip.p3{color:var(--ink-4);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
  .pid{margin-left:auto;font-size:9.5px;color:var(--ink-4);font-family:var(--mono)}
  .card .t{font-size:13px;line-height:1.44;margin-bottom:10px;word-break:break-word;color:var(--ink-1);font-weight:600;letter-spacing:-.005em}
  .mini{height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:9px}
  .mini i{display:block;height:100%;border-radius:99px;background:var(--lime);transition:width .4s}
  .card .foot{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11px}
  .av{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px;
    font-weight:800;color:#0b0d0a;flex:0 0 21px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
  .card .reason{color:var(--coral);font-size:11px;margin-top:8px;line-height:1.45;display:flex;gap:5px}
  .card .dep{color:var(--amber);font-size:11px;margin-top:6px;display:flex;gap:5px;align-items:center}

  /* ---------- aside ---------- */
  aside{border-left:1px solid var(--line);background:rgba(255,255,255,.014);display:flex;flex-direction:column;min-width:0}
  .aside-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .aside-h b{font-size:10px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .aside-h .live{margin-left:auto;font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
  .aside-h .live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(79,227,163,.8)}
  .team{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:3px}
  .mem{display:flex;gap:11px;padding:11px 10px;border-radius:14px;border:1px solid transparent;transition:.16s}
  .mem:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
  .mem .big{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;
    font-size:12.5px;color:#0b0d0a;flex:0 0 34px;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 0 4px rgba(255,255,255,.03)}
  .mem .info{min-width:0;flex:1}
  .mem .n{display:flex;align-items:center;gap:6px;font-weight:650;font-size:12.5px;color:var(--ink-1);letter-spacing:-.01em}
  .mem .seat{font:600 9.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;
    color:var(--ink-4);background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:5px;padding:2px 4px;flex:none}
  .mem .r{color:var(--ink-3);font-size:10.5px;margin-top:2px}
  .mem .now{color:var(--ink-2);font-size:11px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mem .mb{height:3px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
  .mem .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--mint))}
  .load{margin-left:auto;font-size:10px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .load.hot{color:#ffb74d;font-weight:700}

  /* ---------- progress / tables ---------- */
  /* ---------- 时间压力 / 强制复盘 ---------- */
  .press{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 18px;border-radius:16px;
    border:1px solid var(--line);background:var(--surface)}
  .press.critical,.press.overdue{border-color:rgba(255,107,94,.45);
    background:linear-gradient(100deg,rgba(255,107,94,.12),rgba(255,107,94,.02))}
  .press.watch{border-color:rgba(255,196,84,.35);background:linear-gradient(100deg,rgba(255,196,84,.09),transparent)}
  .press .plab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}
  .press .pval{font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--ink-1);
    font-variant-numeric:tabular-nums}
  .press.critical .pval,.press.overdue .pval{color:var(--coral)}
  .press .pbar{position:relative;flex:1 1 220px;height:6px;border-radius:99px;
    background:rgba(255,255,255,.08);overflow:hidden;min-width:160px}
  .press .pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mint),var(--lime));
    border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .press.critical .pbar i,.press.overdue .pbar i{background:linear-gradient(90deg,var(--coral),#ff9a5c)}
  .press .pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.55)}
  .press .pnote{font-size:11px;color:var(--ink-3)}
  .retro{margin-top:12px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,107,94,.4);
    background:linear-gradient(180deg,rgba(255,107,94,.09),rgba(255,107,94,.02))}
  .retro.ok{border-color:rgba(79,227,163,.3);background:linear-gradient(180deg,rgba(79,227,163,.07),transparent)}
  .retro .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .retro .rh b{font-size:13.5px;color:var(--ink-1)}
  .retro .rh .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
    border-radius:99px;border:1px solid currentColor;color:var(--coral)}
  .retro.ok .rh .tag{color:var(--mint)}
  .retro .rh .sp{margin-left:auto;font-size:11px;color:var(--ink-3)}
  .retro .rq{padding:6px 18px 14px;display:grid;gap:9px}
  .retro .qi{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;font-size:11.5px;
    color:var(--ink-2);line-height:1.55}
  .retro .qi .qn{color:var(--ink-4);font-variant-numeric:tabular-nums}
  .retro .qi b{color:var(--ink-1);font-weight:600}
  .retro .qi .ans{display:block;margin-top:3px;color:var(--ink-2);
    padding-left:10px;border-left:2px solid rgba(255,255,255,.14)}
  .retro .qi .miss{color:var(--coral);font-style:normal}
  .retro .ract{display:flex;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
  .retro .ract button{font:inherit;font-size:11.5px;font-weight:650;padding:8px 14px;border-radius:10px;
    cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:.15s}
  .retro .ract button.go{border-color:transparent;background:var(--lime);color:var(--on-lime)}
  .retro .ract button.no:hover{border-color:var(--coral);color:var(--coral)}
  .util{margin-top:6px;display:flex;align-items:center;gap:7px;font-size:10px;color:var(--ink-4);
    font-variant-numeric:tabular-nums}
  .util .ub{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .util .ub i{display:block;height:100%;background:var(--violet)}
  .util.low .ub i{background:var(--coral)}
  .mem{cursor:pointer}
  .mem.lead{background:rgba(204,245,86,.05)}
  /* ---------- 成员抽屉 ---------- */
  .drawer{position:fixed;inset:0;z-index:90;display:none;background:rgba(4,5,7,.55);
    backdrop-filter:blur(6px)}
  .drawer.on{display:block}
  .drawer .dpanel{position:absolute;right:0;top:0;bottom:0;width:min(460px,92vw);
    background:linear-gradient(180deg,#0d1013,#0a0c0e);border-left:1px solid var(--line);
    box-shadow:-30px 0 80px -40px #000;overflow-y:auto;padding:22px 24px 32px;
    animation:slidein .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  .drawer .dx{position:absolute;right:18px;top:16px;width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-3);cursor:pointer;font-size:14px}
  .drawer .dhead{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding-right:34px}
  .drawer .dhead .big{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:16px;color:#0b0d0a}
  .drawer h3{margin:0;font-size:16px;letter-spacing:-.02em}
  .drawer .sub{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;gap:4px;
    align-items:baseline;min-width:0}
  .drawer .sub .srole{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drawer .sub .sstate{white-space:nowrap;flex:0 0 auto}
  .drawer .dsec{margin-top:18px}
  .drawer .dsec>h4{margin:0 0 8px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-4);font-weight:650}
  .drawer .dtask{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
    background:var(--surface)}
  .drawer .dtask b{font-size:12.5px;color:var(--ink-1);font-weight:600}
  .drawer .dtask .dm{font-size:10.5px;color:var(--ink-3);margin-top:5px;
    display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .drawer .dtask .dm .bad{color:var(--coral)}
  .drawer .krow{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;
    color:var(--ink-2);padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .drawer .krow span:last-child{color:var(--ink-3);font-variant-numeric:tabular-nums}
  .drawer .dlink{display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    padding:9px 14px;border-radius:10px;background:var(--lime);color:var(--on-lime);
    font-size:12px;font-weight:700;text-decoration:none}
  .drawer .dlink.ghost{background:transparent;border:1px dashed var(--line);color:var(--ink-3);
    font-weight:550}
  .drawer .dcopy{font-size:10.5px;color:var(--ink-4);margin-top:8px;word-break:break-all;
    font-family:var(--mono,ui-monospace,monospace)}
  /* 抽屉第一屏只回答「他在干什么 / 卡在哪 / 要不要我管」 */
  .drawer .dsum{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:0;
    background:rgba(255,255,255,.03);display:grid;gap:6px}
  .drawer .dsum .lbl{font:600 9.5px/1 system-ui;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-4)}
  .drawer .dsum .what{font-size:14px;font-weight:650;letter-spacing:-.015em;color:var(--ink-1);
    line-height:1.45}
  .drawer .dsum .why{font-size:11.5px;color:var(--ink-3);line-height:1.6}
  .drawer .dsum.warn{border-color:rgba(255,183,77,.45);background:rgba(255,183,77,.06)}
  .drawer .dsum.bad{border-color:rgba(255,125,108,.5);background:rgba(255,125,108,.07)}
  .drawer .dsum.warn .what{color:#ffb74d}
  .drawer .dsum.bad .what{color:var(--coral)}
  .drawer .dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .drawer .dchips span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .drawer .dchips span b{color:var(--ink-1);font-weight:650}
  .drawer .dfold{margin-top:8px;border:1px dashed var(--line);border-radius:11px;padding:9px 12px;
    font-size:11px;color:var(--ink-3);cursor:pointer;display:flex;justify-content:space-between}
  .drawer .dfold:hover{border-color:var(--ink-3);color:var(--ink-1)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .box h4{margin:0 0 16px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
  .row{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .row .lab{width:130px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .bar{height:5px;flex:1;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
  .row .bar.warn i{background:var(--coral)}
  .row .pct{width:52px;text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .donut{display:flex;align-items:center;gap:22px}
  .big-num{font-size:46px;font-weight:800;letter-spacing:-.055em;color:var(--ink-1);font-variant-numeric:tabular-nums;line-height:1}
  .big-num small{font-size:15px;font-weight:650;color:var(--ink-3);letter-spacing:0;margin-left:2px}
  .kv{font-size:12px;color:var(--ink-3);line-height:2.05}
  .kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;flex:1;min-width:0}
  .kv-grid>div{display:flex;flex-direction:column;gap:2px}
  .kv-grid span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
  .kv-grid b{font-size:16px;font-weight:750;color:var(--ink-1);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .kv b{color:var(--ink-1);font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--ink-3);font-weight:650;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    padding:10px 12px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#0a0c0e}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .ev{display:flex;gap:10px;padding:10px 4px;font-size:12px;color:var(--ink-3);border-bottom:1px dashed var(--line)}
  .ev b{color:var(--ink-1);font-weight:650}
  .ev time{margin-left:auto;opacity:.65;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---------- dependency graph ---------- */
  .gwrap{position:relative;border:1px solid var(--line);border-radius:20px;overflow:auto;
    background:radial-gradient(1200px 500px at 50% -10%,rgba(204,245,86,.05),transparent 60%),rgba(255,255,255,.015);
    padding:8px;box-shadow:var(--shadow)}
  .gwrap svg{display:block}
  .gnode{cursor:pointer}
  .gnode .box{fill:rgba(255,255,255,.045);stroke:var(--line-2);stroke-width:1;transition:.16s}
  .gnode:hover .box{fill:rgba(255,255,255,.085);stroke:rgba(204,245,86,.65)}
  .gnode .role{fill:var(--ink-3);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650}
  .gnode .ttl{fill:var(--ink-1);font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  .gnode .meta{fill:var(--ink-3);font-size:10.5px}
  .gnode.s-done .box{stroke:rgba(79,227,163,.4)}
  .gnode.s-doing .box{stroke:rgba(204,245,86,.45);fill:rgba(204,245,86,.05)}
  .gnode.s-review .box{stroke:rgba(182,163,255,.45)}
  .gnode.s-blocked .box{stroke:rgba(255,125,108,.75);fill:rgba(255,125,108,.09)}
  .gnode.s-blocked .box{stroke-dasharray:5 3}
  .gnode.locked .box{stroke:var(--amber);stroke-dasharray:4 4}
  .gedge{fill:none;stroke-width:1.4;transition:.16s}
  .gedge.ok{stroke:rgba(79,227,163,.42)}
  .gedge.wait{stroke:rgba(168,163,92,.55);stroke-dasharray:4 4}
  .gedge.block{stroke:rgba(255,125,108,.7);stroke-dasharray:5 4;stroke-width:1.6}
  .glegend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 4px 2px;font-size:11px;color:var(--ink-3)}
  .glegend .k{display:inline-flex;align-items:center;gap:6px}
  .glegend .sw{width:10px;height:10px;border-radius:3px}
  .gstat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .gempty{padding:70px 20px}
  .chain{margin-bottom:16px}
  .chain-h{display:flex;align-items:center;gap:10px;margin:0 2px 8px;font-size:11px;color:var(--ink-4)}
  .chain-h b{font-size:11.5px;color:var(--ink-2);font-weight:650}
  .chain-h .eyebrow{font-size:9.5px}
  .lonely{display:flex;flex-wrap:wrap;gap:8px}
  .lchip{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink-2);font:inherit;
    transition:.15s;max-width:100%}
  .lchip:hover{border-color:rgba(204,245,86,.35);background:rgba(204,245,86,.05);transform:translateY(-1px)}
  .lchip i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .lchip b{font-size:12px;font-weight:600;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .lchip span{font-size:10.5px;color:var(--ink-4);white-space:nowrap}

<body>
<section id="apcard" style="display:none"></section>
<section id="home" class="home" style="display:none">
  <div class="home-h">
    <div><h2>全部项目</h2><p id="homeSub">加载中…</p></div>
    <button class="btn" onclick="loadHome()">刷新</button>
  </div>
  <div class="home-grid" id="homeGrid"></div>
</section>
<header class="topbar">
  <div class="row1">
    <span class="back" role="button" onclick="goHome()" title="返回全部项目">←</span>
    <div class="brand"><span class="mark"></span><span class="bt"><b>TeamBoard</b><i>team workspace</i></span></div>
    <div class="proj"><h1 id="pname">加载中…</h1><span id="pgoal"></span></div>
    <div class="hactions">
      <div class="cdpill" id="cdpill" title="距离截止还剩"></div>
      <span class="ro-pill">只读视图</span>
      <button class="btn" onclick="exportReport()">导出报告</button>
    </div>
  </div>
  <div class="row2">
    <div class="prog">
      <div class="pct"><span id="pnum">0</span><small>%</small></div>
      <div class="rails">
        <div class="rail" id="prail"></div>
        <div style="font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)" id="pstage">progress</div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="idlewrap" id="idlebanner"></div>
</header>

<main>
  <section class="left">
    <div class="viewbar">
      <div class="tabs" role="tablist">
        <button class="on" data-v="board" onclick="setView('board')">看板</button>
        <button data-v="goal" onclick="setView('goal')">目标</button>
        <button data-v="time" onclick="setView('time')">工时</button>
        <button data-v="progress" onclick="setView('progress')">进度</button>
        <button data-v="deliv" onclick="setView('deliv')">交付物</button>
        <button data-v="feed" onclick="setView('feed')">动态</button>
      </div>
      <div class="tools" id="boardtools">
        <button class="tool" onclick="toggleAllCols(true)">全部展开</button>
        <button class="tool" onclick="toggleAllCols(false)">全部收起</button>
      </div>
    </div>
    <div class="view" id="view-board"><div class="board" id="board"></div></div>
    <div class="view" id="view-goal" style="display:none"></div>
    <div class="view" id="view-time" style="display:none"></div>
    <div class="view" id="view-progress" style="display:none"></div>
    <div class="view" id="view-deliv" style="display:none"></div>
    <div class="view" id="view-feed" style="display:none"></div>

<script>
const COL_LABEL={backlog:"待办",doing:"进行中",review:"待验收",done:"已完成",blocked:"阻塞",abandoned:"已放弃"};
function acceptChip(){
  const g=(S&&S.criteria_green)||0, t=(S&&S.criteria_total)||0, all=(S&&S.criteria_all)||t;
  if(!all) return "";
  if(!t) return `<span class="chip blocked" title="验收标准一条都没跑过判定：${all} 条全是 unknown，所以这里不显示绿">
    验收 <b>${all}</b> 条未判定</span>`;
  return `<span class="chip ${g>=t?"ok":"blocked"}" title="逐条判定结果（unknown 不计入分母）">
    验收 <b>${g}/${t}</b> 绿</span>`;
}
const STATE_LABEL={idle:"摸鱼中",working:"工作中",stale:"僵住",blocked:"卡住·摸鱼中",offline:"摸鱼中"};
// 状态来源：同样是「工作中」，会话在写和任务挂着是两回事，看板不能把它们画成一个样子
const SRC_TAG={session:"会话",task:"任务","task+stale":"任务未回收"};
function stateText(m){
  const base=STATE_LABEL[m.state]||m.state;
  // 人还在干活、只是手上有条卡住的任务：徽章就说「工作中」，
  // 卡点单独一行红字写清楚，别把两件事挤进一个徽章里
  if(m.state_source==="session+blocked") return base;
  const tag=SRC_TAG[m.state_source]||"";
  return (m.state==="working"||m.state==="stale")&&tag?`${base}(${tag})`:base;
}

// 阻塞不是摸鱼：状态仍是两态，但把「卡住」单拎出来，否则看板会把真卡点藏进摸鱼队列
const STATE_TIP={idle:"没在干活",working:"有进行中任务",stale:"任务还挂在 doing/blocked，但执行体已经断了（会话不写、心跳停、或宿主进程没了）：不是卡住，是没人守",blocked:"任务被标阻塞",offline:"没在干活"};
const COL_COLOR={backlog:"#8b9694",doing:"#ccf556",review:"#b6a3ff",done:"#4fe3a3",blocked:"#ff7d6c",abandoned:"#6d7b78"};
const COLORS=["#ccf556","#4fe3a3","#b6a3ff","#6ec8ff","#f5c04a","#ff9f7d","#8fe0d0","#e0c2ff"];
const PREVIEW=3;
let S=null,PID=null,view="board",editId=null,MODELS=[];
let COUNTS=JSON.parse(localStorage.getItem("tb.cols")||"null")||{backlog:true,doing:true,review:true,done:true,blocked:true};
let FULL=JSON.parse(localStorage.getItem("tb.full")||"[]");
const saveCols=()=>localStorage.setItem("tb.cols",JSON.stringify(COUNTS));
const saveFull=()=>localStorage.setItem("tb.full",JSON.stringify(FULL));

const fmtDur=s=>{s=Math.max(0,Math.round(s||0));if(s<60)return s+"s";const m=Math.floor(s/60);
  if(m<60)return m+"m";const h=Math.floor(m/60),mm=m%60;if(h<24)return h+"h"+(mm?mm+"m":"");
  const d=Math.floor(h/24);return d+"d"+(h%24?h%24+"h":"");};
const colorOf=n=>COLORS[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
/* ---- 项目倒计时（本地每秒走字，不依赖 3s 轮询） ---- */
const p2p=n=>String(n).padStart(2,"0");
function cdText(ts){
  const ms=Math.round(ts*1000-Date.now()), over=ms<0; let r=Math.abs(ms);
  const d=Math.floor(r/86400000); r-=d*86400000;
  const h=Math.floor(r/3600000); r-=h*3600000;
  const m=Math.floor(r/60000);  r-=m*60000;
  const s=Math.floor(r/1000);
  return (over?"逾期 ":"")+(d>0?d+"d "+p2p(h)+":"+p2p(m)+":"+p2p(s):p2p(h)+":"+p2p(m)+":"+p2p(s));
}
const cdLevel=p=>p==null?"":(p>=90?"bad":p>=65?"warn":"");
const hhmm=ts=>{const d=new Date(ts*1000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
/* 任务级紧迫度：逾期红，剩 30 分钟内琥珀 */
const etaCls=t=>(t.eta_left<0?"bad":(t.eta_left<1800?"warn":""));
/* 紧迫度：时间烧得快 / 剩余时间不够干活 / 已超支，任一成立就升级颜色 */
function cdUrgency(s){
  if(s.over_budget||(s.hours_left!=null&&s.hours_left<0)) return "bad";
  const lv=cdLevel(s.time_used_pct); if(lv) return lv;
  if(s.hours_left!=null&&s.remaining_hours!=null&&s.hours_left<s.remaining_hours*1.2) return "warn";
  return "";
}
function tickCd(){
  document.querySelectorAll("[data-cts]").forEach(el=>{
    const ts=Number(el.dataset.cts); if(!ts) return;
    el.textContent=cdText(ts);
  });
}
setInterval(tickCd,1000);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 秒 → 人话 */
function dur(sec){
  sec=Math.max(0,Number(sec)||0);
  if(sec<60) return sec+"秒";
  if(sec<3600) return Math.floor(sec/60)+"分钟";
  return Math.floor(sec/3600)+"小时"+Math.floor(sec%3600/60)+"分";
}

/* 两条横幅：① 现在有人在干活吗（idle）② 用户不说话时项目会不会自己跑（autopilot）。
   ② 是根因，① 是症状。都不折叠——折叠等于没人看。 */
function idleBanner(){
  const box=document.getElementById("idlebanner");
  if(!box) return;
  const I=S.idle||{}, A=S.autopilot||{};
  const rows=[];
  if(I.warn){
    const who=(I.silent||[]).slice(0,4)
      .map(x=>`${esc(x.name)} ${x.silent>=0?dur(x.silent):"无会话"}`).join("　");
    // 刚断和断了很久是两件事：都亮，但只有后者会拦写操作
    rows.push(`<div class="idleb ${I.alert?"bad":"warn"}">
      <span>⚠ <b>${I.alert?`全员停摆 ${esc(I.human)}`:"0 个员工在干活"}</b>
      　${I.workers} 个工位一个都没在跑${I.alert?"":`（最后一次动静 ${esc(I.human||"刚刚")}前）`}，
      手上还压着 <b>${I.open_tasks}</b> 条未收工</span>
      <span class="more" onclick="idleDetail()">谁停最久</span>
      <span class="who" id="idlewho" style="display:none">${who}</span>
    </div>`);
  }
  if(!A.found&&S.project){
    rows.push(`<div class="idleb warn">
      <span>⚠ <b>没有自驱心跳</b>　你不出声，这一轮永远不会再来一次</span>
      <span class="more" onclick="autopilotFix('enable')">补上</span>
    </div>`);
  }else if(A.found&&!A.has_board_check){
    rows.push(`<div class="idleb warn">
      <span>⚠ <b>心跳不看团队板</b>　每 ${A.interval_min} 分钟醒一次，但只干自己那条线</span>
      <span class="more" onclick="autopilotFix('patch')">补一段</span>
    </div>`);
  }else if(A.too_slow){
    rows.push(`<div class="idleb warn">
      <span>⚠ <b>心跳太稀</b>　${A.interval_min} 分钟才醒一次</span>
      <span class="more" onclick="autopilotFix('enable')">调密</span>
    </div>`);
  }
  box.innerHTML=rows.join("");
}
function idleDetail(){
  const el=document.getElementById("idlewho");
  if(el) el.style.display=el.style.display==="none"?"inline":"none";
}
async function autopilotFix(action){
  const r=await api("POST","/api/projects/"+PID+"/autopilot",{action});
  toast(r&&r.ok?(action==="patch"?"已把「先看团队板」写进心跳":"自驱心跳已就绪")
                :"失败："+((r&&r.error)||"未知"),r&&r.ok?"ok":"bad");
  await refresh();
}


/* 事件委托：用户数据只进 data-*，不进 on* 属性。
   标题里带一个引号就能把内联 handler 撑破（存储型 XSS），这里彻底不拼 JS 字符串。 */
document.addEventListener("click", e => {
  const tt = e.target.closest && e.target.closest("[data-task-title]");
  if (tt) { openDetailByTitle(tt.getAttribute("data-task-title")); return; }
  const cd = e.target.closest && e.target.closest(".card[data-id]");
  if (cd && !e.target.closest("[data-no-open]")) openDetail(cd.getAttribute("data-id"));
});
/* 沙箱 iframe 里 window.alert/prompt 是被禁的（没 allow-modals），
   点了以后既不弹窗也不报错，用户看到的就是「没反应」。全部改成页内提示。 */
let TOAST_T=null;
function toast(msg,kind){
  let el=document.getElementById("tbtoast");
  if(!el){ el=document.createElement("div"); el.id="tbtoast"; document.body.appendChild(el); }
  el.textContent=String(msg||"");
  el.className="tbtoast on"+(kind?" "+kind:"");
  clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>{ el.className="tbtoast"; },4200);
}
const API="http://127.0.0.1:8787";
let APP=null;
let PENDING=[];            // 待审批队列：会话里推过来几项就依次弹几项
/* 已决 / 稍后集合：批过、驳过的单子落 localStorage。
   宿主会把上一次工具结果的 structuredContent 再推一遍，队列里没有它就会「复活」——
   这是「点了驳回，卡还在」的根因。 */
const DECIDED=(()=>{
  try{ return new Set(JSON.parse(localStorage.getItem("tb.decided")||"[]")); }
  catch(e){ return new Set(); }
})();
const SNOOZED=new Set();   // 「稍后再说」只在本次面板存活期内压制，重开面板还会提醒
function aprKey(p){ const id=p&&p.data&&p.data.id; return id?((p.kind||"")+":"+id):""; }
function isDecided(p){ const k=aprKey(p); return !!k&&DECIDED.has(k); }
function markDecided(p){
  const k=aprKey(p); if(!k) return;
  DECIDED.add(k);
  try{ localStorage.setItem("tb.decided", JSON.stringify([...DECIDED].slice(-300))); }catch(e){}
}
function dropPending(p){
  const k=aprKey(p); if(!k) return;
  PENDING=PENDING.filter(x=>aprKey(x)!==k);
}
/* 服务端是唯一真源。true=还待批 / false=已被处理 / "unknown"=查不到（不吞卡，交给用户兜底） */
async function stillPending(p){
  const id=p&&p.data&&p.data.id, pid=(p&&p.data&&p.data.project_id)||PID;
  if(!id) return "unknown";
  try{
    if(p.kind==="plan"){
      const a=await api("GET",`/api/approvals/${id}`);
      if(!a||a.error||!a.status) return "unknown";
      return a.status==="pending";
    }
    if(p.kind==="staff"){
      const r=await api("GET",`/api/projects/${pid}/staff-requests`);
      const it=(((r&&r.staff_requests)||[]).find(x=>x.id===id));
      if(!it||!it.status) return "unknown";
      return it.status==="pending";
    }
    if(p.kind==="retro"){
      const r=await api("GET",`/api/projects/${pid}/retros`);
      const list=(r&&(r.retros||r))||[];
      const it=(Array.isArray(list)?list:[]).find(x=>x&&x.id===id);
      if(!it||!it.status) return "unknown";
      return it.status==="submitted";
    }
  }catch(e){ return "unknown"; }
  return "unknown";
}
function notePending(sc){
  if(!sc) return;
  const pid=sc.project_id||(sc.pending&&sc.pending.project_id)
            ||(sc.approval&&sc.approval.project_id)||(sc.retro&&sc.retro.project_id);
  if(pid){ PID=pid; window.__TB_PID=pid; }
  const push=p=>{
    if(!p||!p.kind) return;
    const id=p.data&&p.data.id;
    if(PENDING.some(x=>x.kind===p.kind&&(x.data&&x.data.id)===id)) return;
    if(isDecided(p)) return;                     // 批过/驳过的，快照再回放也不入队
    const k=aprKey(p); if(k&&SNOOZED.has(k)) return;
    PENDING.push(p);
  };
  if(Array.isArray(sc.pending)) sc.pending.forEach(push);
  else if(sc.pending) push(sc.pending);
  if(sc.approval&&sc.approval.id) push({kind:"plan",data:sc.approval});
  if(sc.staff_request&&sc.staff_request.id) push({kind:"staff",data:sc.staff_request});
  if(sc.retro) push({kind:"retro",data:sc.retro});
}
let APPLYING=false, APPLY_AGAIN=false;
async function applyPending(){
  if(APPLYING){ APPLY_AGAIN=true; return; }
  APPLYING=true;
  try{
    do{
      APPLY_AGAIN=false;
      while(PENDING.length){
        const p=PENDING[0];
        if(isDecided(p)){ PENDING.shift(); continue; }
        const live=await stillPending(p);   // 渲染前先问服务端：已处理的直接丢
        if(live===false){ markDecided(p); PENDING.shift(); continue; }
        renderApCard(p);                    // 会话里只渲染这一张卡，不铺整个看板
        return;
      }
    }while(APPLY_AGAIN);
  }finally{ APPLYING=false; }
}
function nextPending(){ PENDING.shift(); setTimeout(applyPending,150); }

/* ---------------- 会话内审批卡（紧凑，绝不铺整块看板） ---------------- */
let APC=null;
function renderApCard(p){
  APC=p;
  const d=p.data||{};
  const tag={plan:"计划审批",retro:"强制复盘",staff:"编制变更"}[p.kind]||p.kind;
  let body="";
  if(p.kind==="plan"){
    const mem=(d.members||[]).length, tk=(d.tasks||[]).length;
    // 计划里必须自带配比：P1 是配额，不是形容词（全 P1 等于没优先级）
    const r=d.priority_ratio||null;
    const cnt={1:0,2:0,3:0};
    (d.tasks||[]).forEach(t=>{const k=[1,2,3].includes(+t.priority)?+t.priority:2;cnt[k]++;});
    const rows=(d.tasks||[]).slice(0,4).map((t,i)=>
      `<div><i>${String(i+1).padStart(2,"0")}</i>P${[1,2,3].includes(+t.priority)?t.priority:2} ·
        ${esc(t.title||"—")}${t.estimate?` <span style="color:var(--ink-4)">· ${t.estimate}h</span>`:""}</div>`).join("");
    const more=tk>4?`<div style="color:var(--ink-4)">…还有 ${tk-4} 条</div>`:"";
    body=`<div class="apc-box"><span class="lab">目标</span><p>${esc(d.goal||"（缺目标）")}</p>
        <span class="lab">验收标准</span><p>${esc(d.goal_criteria||"（缺验收标准）")}</p></div>
      <div class="apc-chips"><span>${mem} 人</span><span>${tk} 个任务</span>
        ${r?`<span title="总监填的配额，看板按它切实排优先级">配比 P1 ${r.p1}% / P2 ${r.p2}% / P3 ${r.p3}%</span>
            <span>实际标注 P1 ${cnt[1]} · P2 ${cnt[2]} · P3 ${cnt[3]}</span>`
           :`<span class="warn">没填优先级配比</span>`}
        ${d.over_cap?`<span class="warn">超编：批准后共 ${d.total_after||"?"} 人</span>`:""}</div>
      <div class="apc-box"><span class="lab">任务清单</span><div class="apc-list">${rows||'<div>（没有任务）</div>'}${more}</div></div>
      ${(d.warnings&&d.warnings.length)?`<div class="apc-box" style="border-color:rgba(255,125,108,.45)">
        <span class="lab" style="color:var(--coral)">计划问题（批准前先看这几条）</span>
        <div class="apc-list">${d.warnings.map(w=>`<div>· ${esc(w)}</div>`).join("")}</div></div>`:""}`;
  } else if(p.kind==="retro"){
    const ans=d.answers||{};
    const rows=Object.entries(ans).slice(0,6).map(([k,v])=>
      `<div><i>${esc(k)}</i>${esc(String(v).slice(0,90))}</div>`).join("");
    body=`<div class="apc-chips"><span>第 ${d.round||1} 轮</span><span>已提交，等你批</span></div>
      <div class="apc-box"><span class="lab">复盘要点</span><div class="apc-list">${rows||"<div>（无内容）</div>"}</div></div>`;
  } else {
    const pl=d.payload||{};
    const k={add:"加人",replace:"换人",remove:"撤编"}[d.kind]||d.kind;
    body=`<div class="apc-chips"><span>${esc(k)}</span>
        ${d.seat_no?`<span>工位 #${String(d.seat_no).padStart(2,"0")}</span>`:""}
        ${pl.role?`<span>${esc(pl.role)}</span>`:""}</div>
      <div class="apc-box"><span class="lab">理由</span><p>${esc(d.reason||"—")}</p>
        <span class="lab">对象</span><p>${esc(d.member||pl.name||"—")}</p></div>`;
  }
  const over=d.over_cap;
  document.getElementById("apcard").innerHTML=`
    <div class="apc">
      <div class="apc-h"><span class="apc-tag">${tag}</span><b>${esc(d.summary||d.reason||"等待你确认")}</b></div>
      ${body}
      <div class="apc-note"><input id="apc-note" placeholder="驳回原因（可选，会记进动态）"></div>
      <div class="apc-act">
        <button class="dan" onclick="cardDecide('reject')">驳回</button>
        <button onclick="cardLater()">稍后再说</button>
        <button class="pri" onclick="cardDecide('approve')">${over?"确认扩编并批准":"批准并开工"}</button>
        <span class="done" id="apc-done"></span>
      </div>
    </div>`;
  shellMode("card");
}
function cardLater(){
  const k=aprKey(APC);
  if(k) SNOOZED.add(k);              // 本次面板内不再弹，重开面板还会提醒
  dropPending(APC);
  if(PENDING.length){ applyPending(); return; }
  document.getElementById("apc-done").textContent="已收起，稍后在「团队看板」里还能批";
}
async function cardDecide(decision){
  if(!APC) return;
  const note=(document.getElementById("apc-note")||{}).value||"";
  const id=(APC.data||{}).id;
  const path={plan:`/api/approvals/${id}/decide`,
              retro:`/api/retros/${id}/decide`,
              staff:`/api/staff-requests/${id}/decide`}[APC.kind];
  if(!path){ toast("这张卡没有可执行的审批接口"); return; }
  const body={decision,note};
  if(APC.kind==="plan") body.confirm_over_cap=decision==="approve"&&!!APC.data.over_cap;
  if(APC.kind==="staff") body.by="user";
  const el=document.getElementById("apc-done");
  if(el){ el.style.color=""; el.textContent="提交中…"; }
  const r=await api("POST",path,body);
  if(!r||r.error){
    // 失败必须写在卡上：toast 在长卡里常被翻不到，用户以为「点了没反应」
    const why=(r&&r.error)||(r&&r.need_confirm?"要先勾选扩编确认":"看板服务没响应（点一下刷新再试）");
    if(el){ el.style.color="var(--coral)"; el.textContent="没提交成功："+why; }
    toast("没提交成功："+why);
    return;
  }
  if(r.apply_errors&&r.apply_errors.length){
    toast("已批准，但有部分落库失败：\n"+r.apply_errors.join("\n"));
  } else {
    toast(decision==="approve"?"已批准":"已驳回", "ok");
  }
  // 决策已落库：这张单从此刻起不许再出现（宿主会把旧快照再推一遍）
  markDecided(APC); dropPending(APC);
  if(PENDING.length){ applyPending(); return; }
  document.getElementById("apcard").innerHTML=
    `<div class="apc"><div class="apc-h"><span class="apc-tag">${decision==="approve"?"已批准":"已驳回"}</span>
      <b>${esc((APC.data||{}).summary||"")}</b></div>
      <div class="sub">这一项处理完了。还有别的待批项时刷新会自动出现。</div>
      <div class="apc-act"><button class="pri" onclick="openFullBoard()">打开完整看板</button></div></div>`;
}
function openFullBoard(){
  shellMode("home"); loadHome();
}
const READY=(async()=>{
  try{
    if(!window.MCPApps||!window.MCPApps.App) return null;
    const a=new window.MCPApps.App({name:"TeamBoard",version:"2.0.4"},{});
    // 必须先挂事件再 connect：宿主可能在我们初始化完成前就把 tool-result 推过来了
    a.ontoolresult=(params)=>{
      const sc=params&&(params.structuredContent||(params.params&&params.params.structuredContent));
      notePending(sc);
      if(!PID) return;
      // 只有「这块面板是被这次工具调用唤起来的」才自动切成审批卡；
      // 用户自己打开的看板 / 首页不要被顶掉，只提示一句。
      const explicit=!!(window.__TB_PID||new URLSearchParams(location.search).get("pid"));
      if(!explicit && (HOMED||CARDMODE)){ applyPending(); return; }
      if(!explicit){ refresh().then(applyPending); return; }
      if(PENDING.length) toast(`有 ${PENDING.length} 项等你批，回会话里那张卡处理`, "ok");
    };
    await Promise.race([a.connect(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("connect timeout")),3000))]);
    APP=a;
    return a;
  }catch(e){ return null; }
})();
function api(m,u,b){
  if(APP){
    return APP.callServerTool({name:"tb_api",arguments:{method:m,path:u,body:b||null}})
      .then(r=>{const sc=r&&r.structuredContent; return (sc&&("data" in sc))?sc.data:null;})
      .catch(()=>null);
  }
  return fetch(u.startsWith("http")?u:API+u,{method:m,headers:{"Content-Type":"application/json"},
    body:b?JSON.stringify(b):undefined}).then(r=>r.json());
}

function fmtCd(h){
  if(h==null||h==="")return "";
  const n=Number(h); if(!isFinite(n))return "";
  const a=Math.abs(n);
  const t=a>=24?`${Math.floor(a/24)}d${Math.round(a%24)}h`:a>=1?`${Math.round(a*10)/10}h`:`${Math.round(a*60)}m`;
  return n<0?`超期 ${t}`:`剩 ${t}`;
}

async function boot(){
  const q=new URLSearchParams(location.search);
  const wantPid=window.__TB_PID||q.get("pid");
  MODELS=await api("GET","/api/models").catch(()=>[]);
  if(!Array.isArray(MODELS)) MODELS=[];
  if(wantPid){ showHome(false); PID=wantPid; }
  else {
    showHome(true); await loadHome();
  }
  if(PID) await refresh();
  setInterval(()=>{ if(!HOMED) refresh(); },2000);
  if(q.get("view")) setView(q.get("view"));
  const ap=q.get("approval");
  if(ap){ const a=await api("GET","/api/approvals/"+ap).catch(()=>null); if(a&&a.id) openApproval(a); }
  // 会话里触发的那张审批卡：数据一到就弹，不用用户再去找。
  // 但用户是显式带 pid / approval 打开看板的，别把他的看板顶掉。
  if(!wantPid && !ap) applyPending();
}

        missing_output:"标了完成，但交付物文件找不到",
        weak_evidence:"推断结论不能当已完成"};
      return `<div class="gcomp ${lvl}">
        <div class="gch">
          <b>目标达成 ${att}%</b>
          <span>阶段覆盖 ${scoped}/${total}${total?`（${Math.round(100*scoped/total)}%）`:""}</span>
          <span class="${v.length?"":"ok"}">${v.length?`${v.length} 项待补齐`:"目标 → 阶段 → 任务 全部对齐"}</span>
          ${v.length?`<em>${p0?`${p0} 项阻断 · `:""}逐项展开</em>`:""}
        </div>
        ${v.length?`<div class="gclist">${Object.entries(groups).map(([k,arr])=>
          `<div class="gcrow"><span class="gcode ${k==="missing_output"||k==="no_goal"?"bad":k==="no_milestone"?"hist":"warn"}">${esc(label[k]||k)}</span>
            ${k==="no_milestone"
              ?`<span class="gt sum">${arr.length} 条</span><span class="gnote">${esc(hint[k]||"")}</span>`
              :`<span class="gt sum">${arr.length} 条</span>${arr.slice(0,6).map(x=>x.task
                  ?`<span class="gt" data-task-title="${esc(x.task)}">${esc(x.task)}</span>`
                  :`<span class="gnote">${esc(hint[k]||"")}</span>`).join("")}
                ${arr.length>6?`<span class="gmore">+${arr.length-6}</span>`:""}`}</div>`).join("")}</div>`:""}
      </div>`;
    })()}

    <div class="flags">
      ${blocked.length?`<div class="flag bad"><b>⛔ 卡住的环节</b>${blocked.map(t=>`<span onclick="openDetail('${t.id}')">${esc(t.title)}${t.blocked_reason?` — ${esc(t.blocked_reason)}`:""}</span>`).join("")}</div>`:""}
      ${waiting.length?`<div class="flag wait"><b>🔒 等上游（依赖未完成）</b>${waiting.map(t=>`<span onclick="openDetail('${t.id}')">${esc(t.title)} ← ${esc(t.dep_title)}</span>`).join("")}</div>`:""}
      ${stale.length?`<div class="flag warn"><b>◔ 停滞（≥30 分钟没更新）</b>${stale.map(t=>`<span onclick="openDetail('${t.id}')">${esc(t.title)} · ${fmtDur(t.stale_sec)}</span>`).join("")}</div>`:""}
      ${missing.length?`<div class="flag bad"><b>✘ 交付物不存在</b>${missing.map(t=>`<span onclick="openDetail('${t.id}')">${esc(t.title)} — ${esc((t.deliverable_missing||[]).join("、"))}</span>`).join("")}</div>`:""}
      ${conflicts.length?`<div class="flag bad"><b>⚠ 资源冲突</b>${conflicts.map(([r,ts])=>`<span>${esc(r)} 同时被 ${esc(ts.join(" / "))} 占用</span>`).join("")}</div>`:""}
      ${(S.critical_chain||[]).length>1?`<div class="flag wait"><b>🧭 关键路径（决定收工时间）</b>
        <span>${S.critical_chain.map(x=>esc(x)).join(" → ")}</span></div>`:""}
      ${(S.over_top||[]).length?`<div class="flag bad"><b>💸 超预算最多</b>
        ${S.over_top.map(t=>`<span onclick="openDetail('${t.id}')">${esc(t.title)} — 超 ${fmtDur(t.over_sec)}（预算 ${t.estimate}h / 已花 ${fmtDur(t.spent)}）</span>`).join("")}</div>`:""}
    </div>

    <div class="section-h"><span class="eyebrow">breakdown</span><b>支撑这个目标的任务</b>
      <span>按阶段分组，点任意任务看详情</span></div>

    <details class="chaingate">

function retroHTML(rt){
  const latest=rt.latest, qs=rt.questions||[], req=!!rt.required;
  if(!latest&&!req)return "";
  const st=latest?(latest.status||"pending"):"pending";
  const tag={pending:"待总监提交",submitted:"等你批准",approved:"已批准",rejected:"已驳回"}[st]||st;
  const ans=(latest&&latest.answers)||{};
  const n=(latest&&latest.round)||rt.round||1;
  const util=rt.utilization||{};
  const isRed=req||st==="rejected";
  return `<div class="retro ${isRed?"":"ok"}">
    <div class="rh">
      <b>强制复盘 · 第 ${n} 轮</b>
      <span class="tag">${tag}</span>
      ${req?`<span class="sp" style="color:var(--coral)">${esc(rt.reason||"")} ·
        阻断 ${esc((rt.blocked_actions||[]).join("、"))}</span>`:
        `<span class="sp">${rt.rearm_min?`批准后 ${rt.rearm_min} 分钟内有效`:"已通过"}</span>`}
    </div>
    <div class="rq">
      ${qs.map((q,i)=>{
        const a=(ans[q.key]||"").trim();
        return `<div class="qi"><span class="qn">0${i+1}</span><div>
          <b>${esc(q.q)}</b>
          ${a?`<span class="ans">${esc(a)}</span>`
             :`<span class="ans miss">未回答 — ${esc(q.hint||"")}</span>`}
        </div></div>`;
      }).join("")}
      ${util.team_pct!=null?`<div class="qi"><span class="qn">实测</span><div>
        <b>看板算出来的利用率</b>
        <span class="ans">团队 ${util.team_pct}%${(util.slackers||[]).length
          ?` · 摸鱼：${util.slackers.map(x=>esc(x.name)+"（"+x.util_pct+"%）").join("、")}`
          :" · 没有明显摸鱼"}</span></div></div>`:""}
    </div>
    ${st==="submitted"?`<div class="ract">
      <button class="go" onclick="decideRetro('${latest.id}','approve')">批准，按这套方案执行</button>
      <input id="rtn-${latest.id}" placeholder="驳回原因（可选）"
        style="flex:1;min-width:140px;background:rgba(0,0,0,.28);border:1px solid var(--line);
        border-radius:9px;padding:7px 10px;color:var(--ink-1);font:inherit;font-size:11.5px;outline:none">
      <button class="no" onclick="decideRetro('${latest.id}','reject')">驳回，让他重写</button>
      <span class="sp" style="font-size:10.5px;color:var(--ink-4);align-self:center">
        批准前：加人 / 新计划 / 导出报告 全部被拦</span></div>`:""}
  </div>`;
}
async function decideRetro(id,decision){
  const ne=document.getElementById(`rtn-${id}`);
  const note=ne?ne.value.trim():"";
  const r=await api("POST",`/api/retros/${id}/decide`,{decision,note});
  if(r&&r.error){toast(r.error);return;}
  await refresh();
  nextPending();
}

/* ---------------- 依赖链（目标页内嵌） ---------------- */
function graphHTML(){
  const tasks=S.tasks.slice();
  if(!tasks.length){ return '<div class="box gempty empty"><b>还没有任务</b>先拆任务，再设依赖</div>'; }
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const depOf=t=>(t.depends_on&&byId.has(t.depends_on))?t.depends_on:null;

  // 1) split into connected components so each chain reads on its own line
  const parent={}; tasks.forEach(t=>parent[t.id]=t.id);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[b]=a;};
  tasks.forEach(t=>{const d=depOf(t); if(d) union(t.id,d);});
  const comps=new Map();
  tasks.forEach(t=>{const k=find(t.id); if(!comps.has(k))comps.set(k,[]); comps.get(k).push(t);});

  const rank={blocked:0,doing:1,review:2,backlog:3,done:4};
  const W=232,H=68,GX=80,PAD=18,ROW=H+14;
  const clip=(s,max)=>{let out="",w=0;for(const ch of String(s)){const cw=/[\u3000-\u9fff\uff00-\uffef]/.test(ch)?2:1;
    if(w+cw>max){out+="…";break;} w+=cw; out+=ch;} return out;};
  const color=s=>COL_COLOR[s]||"#8b9694";

  const chains=[...comps.values()].filter(c=>c.some(t=>depOf(t))||c.some(t=>tasks.some(x=>depOf(x)===t.id)));
  const lonely=[...comps.values()].filter(c=>!chains.includes(c)).flat();

  function chainHTML(list,idx){
    // depth = longest upstream path inside this chain
    const depth=new Map(),vis=new Set();
    const calc=t=>{
      if(depth.has(t.id))return depth.get(t.id);
      if(vis.has(t.id)){depth.set(t.id,0);return 0;}
      vis.add(t.id);
      const d=depOf(t); const v=(d&&list.includes(byId.get(d)))?calc(byId.get(d))+1:0;
      vis.delete(t.id); depth.set(t.id,v); return v;
    };
    list.forEach(calc);
    const maxD=Math.max(...list.map(t=>depth.get(t.id)),0);
    const layers=[]; for(let d=0;d<=maxD;d++) layers.push([]);
    list.slice().sort((a,b)=>(rank[a.status]-rank[b.status])||((a.priority||2)-(b.priority||2)))
      .forEach(t=>layers[depth.get(t.id)].push(t));
    const maxRows=Math.max(...layers.map(l=>l.length),1);
    const width=(maxD+1)*W+maxD*GX+PAD*2, height=maxRows*ROW+PAD*2-14;
    const pos=new Map();
    layers.forEach((l,d)=>l.forEach((t,i)=>{
      const y=PAD+(maxRows-l.length)*ROW/2+i*ROW;
      pos.set(t.id,{x:PAD+d*(W+GX),y});
    }));
    const defs=`<marker id="ar${idx}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6a3"/></marker>`;
    const edges=list.map(t=>{
      const d=depOf(t); if(!d||!pos.has(d))return "";
      const a=pos.get(d),b=pos.get(t.id),x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,dx=Math.max(28,(x2-x1)*.45);
      const par=byId.get(d), cls=t.status==="blocked"?"block":(par.status==="done"?"ok":"wait");
      return `<path class="gedge ${cls}" marker-end="url(#ar${idx})"
        d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}">
        <title>${esc(t.title)} 依赖 ${esc(par.title)}</title></path>`;
    }).join("");
    const nodes=list.map(t=>{
      const p=pos.get(t.id),m=S.members.find(x=>x.id===t.assignee_id);
      const dd=depOf(t),up=dd?byId.get(dd):null,locked=up&&up.status!=="done";
      return `<g class="gnode s-${t.status}${locked?" locked":""}" transform="translate(${p.x},${p.y})"
          role="button" tabindex="0" onclick="openDetail('${t.id}')"
          onkeydown="if(event.key==='Enter')openDetail('${t.id}')">
        <title>${esc(t.title)}${up?`　← 依赖：${esc(up.title)}`:"　（无上游依赖）"}</title>
        <rect class="box" width="${W}" height="${H}" rx="12"/>
        <circle cx="16" cy="18" r="4" fill="${color(t.status)}"/>
        <text class="role" x="27" y="21.5">${esc(clip(t.role||"未分类",10))}</text>
        <text class="meta" x="${W-12}" y="21.5" text-anchor="end">${t.progress||0}%</text>
        <text class="ttl" x="13" y="43">${esc(clip(t.title,24))}</text>
        <text class="meta" x="13" y="57">${esc(clip(m?m.name:"未分配",10))}${locked?" · 🔒":""}</text>
      </g>`;
    }).join("");
    return `<div class="chain">
      <div class="chain-h"><span class="eyebrow">chain ${String(idx).padStart(2,"0")}</span>
        <b>${list.length} 个任务</b><span>左 → 右：左边先完成，右边才能开工</span></div>
      <div class="gwrap"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <defs>${defs}</defs>${edges}${nodes}</svg></div>
    </div>`;
  }

  const blockedNow=tasks.filter(t=>{const d=depOf(t);return d&&byId.get(d).status!=="done";});
  const doneN=tasks.filter(t=>t.status==="done").length;
  const chainHTMLs=chains.map((c,i)=>chainHTML(c,i+1)).join("");

  const lonelyHTML=lonely.length?`<div class="chain">
      <div class="chain-h"><span class="eyebrow">no deps</span><b>${lonely.length} 个任务</b>
        <span>独立任务，不卡任何人也不被卡</span></div>
      <div class="lonely">${lonely.map(t=>{
        const m=S.members.find(x=>x.id===t.assignee_id);
        return `<button class="lchip s-${t.status}" onclick="openDetail('${t.id}')">
          <i style="background:${color(t.status)}"></i><b>${esc(t.title)}</b>
          <span>${esc(t.role||"—")} · ${esc(m?m.name:"未分配")}</span>
          <em>${t.progress||0}%</em></button>`;
      }).join("")}</div></div>`:"";

  const relRows=tasks.filter(t=>depOf(t)).map(t=>{
    const up=byId.get(depOf(t));
    return `<tr><td><b>${esc(t.title)}</b></td><td class="rel">← ${esc(up.title)}</td>
      <td><span class="chip ${up.status}" style="padding:3px 8px;font-size:10.5px"><span class="d"></span>${COL_LABEL[up.status]}</span></td>
      <td><span class="chip ${t.status}" style="padding:3px 8px;font-size:10.5px"><span class="d"></span>${COL_LABEL[t.status]}</span></td>
      <td>${up.status==="done"?"已解锁":"等上游"}</td></tr>`;
  }).join("");

  const waitRows=blockedNow.map(t=>{
    const par=byId.get(depOf(t));
    return `<button class="waitcard" onclick="openDetail('${t.id}')">
      <span class="wdot"></span><b>${esc(t.title)}</b>
      <span class="warrow">←</span><span class="wsrc">等 ${esc(par.title)}</span>
      <span class="wprog">${t.progress||0}%</span></button>`;
  }).join("");

  return `
    <div class="gstat">
      <span class="chip"><b>${tasks.length}</b>节点</span>
      <span class="chip doing"><span class="d"></span>可推进<b>${tasks.filter(t=>t.status!=="done"&&!blockedNow.includes(t)).length}</b></span>
      <span class="chip review"><span class="d"></span>被上游卡住<b>${blockedNow.length}</b></span>
      <span class="chip done"><span class="d"></span>已完成<b>${doneN}</b></span>
    </div>
    ${blockedNow.length?`<div class="waitstrip">
      <span class="eyebrow" style="flex:0 0 auto">blocked</span>${waitRows}</div>`:""}
    ${chainHTMLs||'<div class="box empty"><b>还没有依赖链</b>在任务里设置「依赖任务」，这里会画出链路</div>'}
    ${lonelyHTML}
    ${relRows?`<div class="box" style="margin-top:14px;padding:8px 8px 0">
      <table class="reltable"><thead><tr><th>任务</th><th>依赖</th><th>上游状态</th><th>本任务</th><th>能否开始</th></tr></thead>
      <tbody>${relRows}</tbody></table></div>`:""}
    <div class="glegend">
      <span class="k"><span class="sw" style="background:#4fe3a3"></span>已完成</span>
      <span class="k"><span class="sw" style="background:#ccf556"></span>进行中</span>
      <span class="k"><span class="sw" style="background:#b6a3ff"></span>待验收</span>
      <span class="k"><span class="sw" style="background:#8b9694"></span>待办</span>
      <span class="k"><span class="sw" style="background:#ff7d6c"></span>阻塞</span>
      <span class="k"><i class="ln ok"></i>上游已完成</span>
      <span class="k"><i class="ln wait"></i>等上游</span>
      <span class="k"><i class="ln block"></i>阻塞链路</span>
      <span class="k" style="margin-left:auto">点节点看详情</span>
    </div>`;
}

/* ---------------- 计划审批 ---------------- */
let APR=null, seenApr=new Set();
function maybeApproval(){
  const list=(S&&S.pending_approvals)||[];
  if(!list.length) return;
  if(document.getElementById("amodal").classList.contains("on")) return;
  const a=list[0];
  if(seenApr.has(a.id)) return;
  openApproval(a);
}
function closeApproval(){
  document.getElementById("amodal").classList.remove("on");
  if(APR) seenApr.add(APR.id);
  APR=null;
}

    ${over?`<div class="apr-warn"><b>超过默认团队上限</b>

async function decideStaff(decision){
  if(!SREQ) return;
  const r=await api("POST","/api/staff-requests/"+SREQ.id+"/decide",
                   {decision,by:"user"});
  if(r&&r.error){ toast(r.error); return; }
  closeApproval(); await refresh(); nextPending();
}

async function decideApproval(decision){
  if(!APR) return;
  const over=!!APR.over_cap;
  if(decision==="approve"&&over){
    const box=document.getElementById("apr-over");
    if(!box||!box.checked){ toast("这个计划超过默认 5 人上限，先勾选扩编确认。"); return; }
  }
  const ne=document.getElementById("apr-note");
  const note=ne?ne.value.trim():"";
  const body={decision,note,confirm_over_cap:decision==="approve"&&over};
  const r=await api("POST","/api/approvals/"+APR.id+"/decide",body);
  if(r&&r.error){ toast(r.error); return; }
  if(r&&r.apply_errors&&r.apply_errors.length) toast("已批准，但有部分落库失败：\n"+r.apply_errors.join("\n"));
  closeApproval();
  await refresh();
  nextPending();
}

/* ---------------- 成员抽屉：他在做什么 / 卡在哪 ---------------- */
const drawer=document.getElementById("drawer"),dpanel=document.getElementById("dpanel");
function closeMember(){drawer.classList.remove("on");}
function openMember(id){
  const m=(S.members||[]).find(x=>x.id===id); if(!m)return;
  const doing=m.doing_tasks||[];
  const tasks=(S.tasks||[]).filter(t=>t.assignee_id===id);
  const live=doing.filter(d=>!d.waits_on);
  const cur=live[0]||doing[0]||null;
  const nextUp=tasks.filter(t=>t.status==="backlog")
    .sort((a,b)=>(a.priority||2)-(b.priority||2))[0]||null;
  const dones=tasks.filter(t=>t.status==="done");
  // 停滞分级：30 分钟黄、90 分钟红。这个数比「完成百分比」有用得多
  const stale=cur?cur.stale_sec:0;
  const lvl=stale>=5400?"bad":stale>=1800?"warn":"";
  const blocked=tasks.filter(t=>t.status==="blocked")[0];
  const waiting=cur&&cur.waits_on;
  let sumCls="", what="", why="";
  if(m.state==="blocked"||blocked){
    sumCls="bad";
    what=blocked?`卡住：${esc(blocked.title)}`:"被标为阻塞";
    why=esc(m.stuck||(blocked&&blocked.blocked_reason)||"没写原因——总监要补一句卡在哪");
  }else if(cur){
    sumCls=lvl;
    what=`正在做「${esc(cur.title)}」`;
    why=(waiting?`等上游「${esc(waiting)}」`:"")
      +(stale>=1800?`${waiting?" · ":""}${fmtDur(stale)}没更新${stale>=5400?"（够重开一次了，去看看）":""}`
        :`${waiting?" · ":""}刚落笔，还在推`)
      +` · 进度 ${cur.progress}%`;
  }else if(nextUp){
    what="手上没有在跑的任务";
    why=`下一条待办：「${esc(nextUp.title)}」（${nextUp.estimate||"?"}h）——接着派给他`;
  }else{
    what="闲着，也没排到活";
    why="要提速就给他加活；真没活可干，就该撤一个工位，别让编制虚占";
  }
  dpanel.innerHTML=`
    <button class="dx" onclick="closeMember()">✕</button>
    <div class="dhead">
      <div class="big" style="background:${colorOf(m.name)}">${esc(m.name[0])}</div>
      <div>
        <h3><span class="seat">${esc(m.seat_label||"#--")}</span> ${esc(m.name)}${
          m.is_lead?' <span class="badge">项目总监</span>':""}</h3>
        <div class="sub"><span class="srole">${esc(m.role||"—")}${
            m.model?` · ${esc(m.model)}${m.effort?" "+esc(m.effort):""}`:""}</span>
          · <b class="sstate" style="color:${m.state==="working"?"var(--lime)":"var(--ink-3)"}">${
            stateText(m)}${m.state!=="working"&&m.away_for>=0?` ${fmtDur(m.away_for)}`:""}</b></div>
      </div>
    </div>
    <div class="dsum ${sumCls}">
      <span class="lbl">一句话</span>
      <div class="what">${what}</div>
      <div class="why">${why}</div>
    </div>
    <div class="dchips">
      <span>完成 <b>${m.done_count}/${m.total}</b></span>
      <span>${m.is_lead?`在手 <b>${m.load}</b> 条`:`负载 <b>${m.load}/${m.capacity}</b>${m.overload?' <b style="color:#ffb74d">超载</b>':""}`}</span>
      <span>累计 <b>${fmtDur(m.time_total)}</b></span>
      ${cur&&cur.elapsed&&Math.abs((cur.elapsed||0)-(m.time_total||0))>60
        ?`<span>本段 <b>${fmtDur(cur.elapsed)}</b></span>`:""}
    </div>
    <div class="dsec" id="dthread">
      <h4>找他本人</h4>
      ${m.thread_id
        ?`<button class="dlink" onclick="openThread('${esc(m.thread_id)}')">↗ 打开他的会话</button>`
        :`<span class="dcopy">正在找他的会话…</span>`}
    </div>
    ${(doing.filter(d=>d!==cur).length)?`<div class="dsec">
      <h4>手上还有（${doing.filter(d=>d!==cur).length}）</h4>
      ${doing.filter(d=>d!==cur).map(d=>`<div class="dtask" onclick="closeMember();openDetail('${d.id}')">
        <b>${esc(d.title)}</b>
        <div class="dm"><span>${d.progress}%</span><span>已进行 ${fmtDur(d.elapsed||d.total_time)}</span>
          ${d.stale_sec>=1800?`<span class="bad">${fmtDur(d.stale_sec)} 没更新</span>`:""}
          ${d.waits_on?`<span class="bad">等 ${esc(d.waits_on)}</span>`:""}</div>
      </div>`).join("")}
    </div>`:""}
    ${nextUp?`<div class="dsec">
      <h4>下一步</h4>
      <div class="dtask" onclick="closeMember();openDetail('${nextUp.id}')">
        <b>${esc(nextUp.title)}</b>
        <div class="dm"><span>待办</span><span>估 ${nextUp.estimate||"?"}h</span>
          <span>P${nextUp.priority||2}</span></div>
      </div>
    </div>`:""}
    ${dones.length?`<div class="dfold" onclick="toggleDones(this,'${id}')">
      <span>已完成 ${dones.length} 项</span><span>展开 ▾</span></div>
      <div id="dones-${id}" style="display:none">
        ${dones.map(t=>`<div class="dtask" onclick="closeMember();openDetail('${t.id}')">
          <b>${esc(t.title)}</b><div class="dm"><span>已完成</span><span>${t.progress||100}%</span></div>
        </div>`).join("")}
      </div>`:""}
  `;
  drawer.classList.add("on");
  if(!m.thread_id) fillThreads(m.id);
}

function toggleDones(el,mid){
  const box=document.getElementById("dones-"+mid);
  if(!box) return;
  const open=box.style.display!=="none";
  box.style.display=open?"none":"";
  el.lastElementChild.textContent=open?"展开 ▾":"收起 ▴";
}

async function openThread(tid){

  if(!r||r.error){
    toast("打不开会话："+((r&&r.error)||"请求失败")+"\n可以直接把这个 id 贴进 Codex：\n"+tid);

async function fillThreads(mid){
  const el=document.getElementById("dthread");
  if(!el)return;
  const d=await api("GET",`/api/projects/${PID}/threads`).catch(()=>null);
  const mine=d&&(d.members||[]).find(x=>x.member_id===mid);
  const cands=(mine&&mine.candidates)||[];
  if(!cands.length){
    el.innerHTML=`<h4>他的会话</h4>
      <span class="dcopy">没找到匹配的会话记录。总监 spawn 后把 thread_id 登记进来
      （MCP: add_member(thread_id=…) 或 set_member_thread），这里就能直达。</span>`;
    return;
  }
  el.innerHTML=`<h4>他的会话（找到 ${cands.length} 个候选）</h4>
    ${cands.map(c=>`<div class="dtask">
      <b>${esc(c.snip||c.id)}</b>
      <div class="dm"><span>${c.age_min} 分钟前</span>

}

async function bindThread(mid,tid){
  const r=await api("PATCH",`/api/members/${mid}`,{thread_id:tid});
  if(r&&r.error){toast(r.error);return;}
  await refresh();
  openMember(mid);
  openThread(tid);
}
